<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Working Windmill</title>
</head>
<style>
  .windmill {
    fill: #ff6600;
    fill-opacity: 0.5;
  }
</style>

<body>
  <svg width="200" height="400">
    <rect x="0" y="0" width="200" height="400" fill="none" stroke="black" stroke-width="1" stroke-dasharray="8,4" />

    <path class="windmill" d="M 93 300 L 107 300 L 103 165 L 97 165" />

    <g class="windmill" id="windmill-head" transform="translate(100, 150)">
      <circle r="8" />
      <path id="arm" d="M-7-20C-7-10 7-10 7-20L2-80-2-80" />
      <use href="#arm" transform="rotate(120)" />
      <use href="#arm" transform="rotate(-120)" />

      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"
        additive="sum" />
    </g>
  </svg>
</body>

</html>
